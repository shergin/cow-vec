[package]
name = "cow_vec"
version = "1.4.0"
edition = "2021"
rust-version = "1.75"
authors = ["Valentin Shergin"]
description = "A vector-like container optimized for efficient cloning with copy-on-write semantics"
license = "MIT"
repository = "https://github.com/shergin/cow-vec"
documentation = "https://docs.rs/cow_vec"
readme = "README.md"
keywords = ["vector", "copy-on-write", "cow", "persistent", "clone"]
categories = ["data-structures", "memory-management"]

[dependencies]
typed-arena = "2"
serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]
