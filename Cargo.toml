[package]
name = "cow_vec"
version = "2.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Valentin Shergin"]
description = "Vectors optimized for O(1) clone: flat and paged copy-on-write containers that copy pointers, never elements"
license = "MIT"
repository = "https://github.com/shergin/cow-vec"
documentation = "https://docs.rs/cow_vec"
readme = "README.md"
keywords = ["vector", "copy-on-write", "cow", "persistent", "snapshot"]
categories = ["data-structures", "memory-management"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = { version = "1", optional = true }

[dev-dependencies]
criterion = "0.5.1"
imbl = "4.0.1"
serde_json = "1"

[features]
serde = ["dep:serde"]

[[bench]]
name = "compare"
harness = false
